name: Compare

# Class A comparisons (pipeline/compare_sample.py): on Tuesdays and
# Thursdays around midday, a two-hour sample of each peer's live feed in
# reference/peers/feeds.csv (since compare/0.3.0 the two Washington peers,
# Skagit and Intercity) is run through our own method. The compare stage
# pools the samples of the last 8 weeks. Only a small summary of each sample
# is kept, on the data branch under compare/; no other agency's raw data is
# stored. A missing sample is normal: feeds move and go down. `mode:
# discover` lists the peers' open feeds in the Mobility Database catalog
# instead (scripts/peer_feeds.py).
on:
  schedule:
    - cron: "17 19 * * 2,4" # 11:17 AM Pacific standard time (12:17 PM in summer)
  workflow_dispatch:
    inputs:
      mode:
        description: "sample or discover"
        type: choice
        options: [sample, discover]
        default: sample
      agency:
        description: "agency_id to sample (as in feeds.csv); empty: every peer"
        type: string
        default: ""

permissions:
  contents: write
  actions: write # redeploy the site after publishing

concurrency:
  group: compare
  cancel-in-progress: false

jobs:
  discover:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'discover'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python scripts/peer_feeds.py

  plan:
    if: github.event_name == 'schedule' || inputs.mode == 'sample'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      feeds: ${{ steps.pick.outputs.feeds }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: pick
        env:
          AGENCY: ${{ inputs.agency }}
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import csv, json, os
          agency = os.environ.get("AGENCY", "")
          rows = [r for r in csv.DictReader(open("reference/peers/feeds.csv", encoding="utf-8"))
                  if r["rt_url"] and r["static_url"] and agency in ("", r["agency_id"])]
          print("feeds=" + json.dumps(rows))
          EOF

  sample:
    needs: plan
    if: needs.plan.outputs.feeds != '[]' && needs.plan.outputs.feeds != ''
    runs-on: ubuntu-latest
    timeout-minutes: 150
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        feed: ${{ fromJSON(needs.plan.outputs.feeds) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - run: pip install -e . -c constraints.txt
      - name: Sample the feed for two hours
        env:
          AGENCY: ${{ matrix.feed.agency_id }}
          RT: ${{ matrix.feed.rt_url }}
          STATIC: ${{ matrix.feed.static_url }}
        run: |
          python -m pipeline.compare_sample --agency "$AGENCY" --rt "$RT" --static "$STATIC" \
            --minutes 120 --out "samples/$AGENCY/$(date -u +%Y-%m-%d).json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sample-${{ matrix.feed.agency_id }}
          path: samples
          retention-days: 7

  publish:
    needs: sample
    # Not after a cancel: a cancelled run has no samples to keep, and its
    # code may be older than the comparisons already published.
    if: ${{ !cancelled() && needs.sample.result != 'skipped' }}
    # One writer of the data branches at a time (with nightly.yml and
    # validators.yml), so promotions happen in order.
    concurrency:
      group: data-writer
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # The code of main as it is now, not as it was when the run started two
      # hours ago: a stage version bumped in between would otherwise make the
      # gate refuse data that the nightly job has already rebuilt.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sample-*
          path: samples
          merge-multiple: true
      - name: Get the staging data branch
        run: scripts/get_data_branch.sh
      - name: Keep the summaries and redo the comparisons
        run: |
          mkdir -p data-branch/compare
          if [ -d samples ]; then cp -r samples/. data-branch/compare/; fi
          python -m pipeline.compare --data data-branch
      - name: Publish to data-staging
        run: scripts/publish_data.sh data-staging "Comparison samples:"
      # The light gate (I1 to I8 and I13), then data moves to the new commit. Only
      # when staging held nothing else: commits that the nightly job's full
      # gate has not passed are promoted by the nightly job, with these.
      - name: Check the figures and move data
        if: env.STAGING_BASE == env.DATA_BASE
        run: scripts/light_gate_promote.sh
      - name: Leave the promotion to the nightly job
        if: env.STAGING_BASE != env.DATA_BASE
        run: echo "data-staging holds commits the nightly gate has not passed; the nightly job promotes these comparisons with them"
      # The site copies compare/summary.json at build time; without this the
      # new samples would wait for a nightly run that changes data itself.
      - name: Redeploy the site with the new comparisons
        if: env.PROMOTED == '1'
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
