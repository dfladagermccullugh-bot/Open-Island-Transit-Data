name: Watchdog

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: watchdog
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TITLE: "Collector problem"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      # The watchdog only needs requests; the full install took most of each run.
      - run: pip install requests -c constraints.txt
      - name: Start the nightly job if yesterday is still unprocessed
        continue-on-error: true
        run: python scripts/catch_up.py
      - name: Check the collector
        id: check
        run: |
          set +e
          python scripts/watchdog.py | tee report.txt
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Open or update an issue while there is a problem
        if: steps.check.outputs.code != '0'
        run: |
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          if [ -z "$number" ]; then
            gh issue create --title "$TITLE" --body-file report.txt
          else
            # Comment only when the list of problems changed (the first line
            # of the report is its time), so a long outage is one thread, not
            # a comment every half hour.
            last=$(gh issue view "$number" --json body,comments --jq '(.comments | last | .body) // .body')
            if [ "$(tail -n +2 report.txt)" != "$(printf '%s\n' "$last" | tail -n +2)" ]; then
              gh issue comment "$number" --body-file report.txt
            fi
          fi
      - name: Close the issue once the collector is healthy again
        if: steps.check.outputs.code == '0'
        run: |
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "Collector is healthy again. $(cat report.txt)"
          fi
      - name: Fail the run so GitHub sends a notification
        if: steps.check.outputs.code != '0'
        run: exit 1
