name: Watchdog

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: watchdog
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TITLE: "Collector problem"
      DATA_TITLE: "Data check"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # The watchdog only needs requests; the full install took most of each run.
      - run: pip install requests -c constraints.txt
      - name: Tell the outside monitor the run started
        run: scripts/ping.sh start
        env:
          HC_PING_URL: ${{ secrets.HC_PING_URL }}
      # The published figures, read from the data branch itself, for the
      # tiered data checks (scripts/anomaly.py).
      - name: Get the data branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data
          path: data-branch
      # What the writers published and the gate has not passed (yet): a
      # failed gate's report, and how long data has stayed behind.
      - name: Get the staging data branch
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data-staging
          path: data-staging
      - name: Start the nightly job if yesterday is still unprocessed
        continue-on-error: true
        run: python scripts/catch_up.py
      - name: Check the collector
        id: check
        run: |
          set +e
          python scripts/watchdog.py | tee report.txt
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Open or update an issue while there is a problem
        if: steps.check.outputs.code != '0'
        run: |
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          if [ -z "$number" ]; then
            gh issue create --title "$TITLE" --body-file report.txt
          else
            # Comment only when the list of problems changed (the first line
            # of the report is its time), so a long outage is one thread, not
            # a comment every half hour.
            last=$(gh issue view "$number" --json body,comments --jq '(.comments | last | .body) // .body')
            if [ "$(tail -n +2 report.txt)" != "$(printf '%s\n' "$last" | tail -n +2)" ]; then
              gh issue comment "$number" --body-file report.txt
            fi
          fi
      - name: Close the issue once the collector is healthy again
        if: steps.check.outputs.code == '0'
        run: |
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "Collector is healthy again. $(cat report.txt)"
          fi
      # The published figures, in an issue of their own (scripts/anomaly.py):
      # exit 4 is a problem and fails the run; 1 is something to look at
      # (a comment, no failure); 3 is notes only and 0 nothing (the issue is
      # closed); 2 means the figures could not be read and leaves the issue
      # as it is.
      - name: Check the published figures
        id: data
        if: always()
        run: |
          set +e
          python scripts/watchdog.py --data --data-dir data-branch --staging-dir data-staging | tee data-report.txt
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Open or update the data issue while there is something to look at
        if: always() && (steps.data.outputs.code == '1' || steps.data.outputs.code == '4')
        continue-on-error: true
        run: |
          number=$(gh issue list --state open --search "in:title \"$DATA_TITLE\"" --json number --jq '.[0].number')
          if [ -z "$number" ]; then
            gh issue create --title "$DATA_TITLE" --body-file data-report.txt
          else
            last=$(gh issue view "$number" --json body,comments --jq '(.comments | last | .body) // .body')
            if [ "$(tail -n +2 data-report.txt)" != "$(printf '%s\n' "$last" | tail -n +2)" ]; then
              gh issue comment "$number" --body-file data-report.txt
            fi
          fi
      - name: Close the data issue once the figures raise nothing
        if: always() && (steps.data.outputs.code == '0' || steps.data.outputs.code == '3')
        continue-on-error: true
        run: |
          number=$(gh issue list --state open --search "in:title \"$DATA_TITLE\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "Nothing to report any more. $(cat data-report.txt)"
          fi
      - name: Tell the outside monitor how the run ended
        if: always()
        run: |
          if [ "${{ steps.check.outputs.code }}" = "0" ] && [ "${{ steps.data.outputs.code }}" != "4" ]; then
            scripts/ping.sh success
          else
            scripts/ping.sh fail
          fi
        env:
          HC_PING_URL: ${{ secrets.HC_PING_URL }}
      - name: Fail the run so GitHub sends a notification
        if: always() && (steps.check.outputs.code != '0' || steps.data.outputs.code == '4')
        run: exit 1
