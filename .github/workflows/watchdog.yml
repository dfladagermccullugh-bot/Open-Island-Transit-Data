name: Watchdog

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: watchdog
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TITLE: "Collector problem"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Start the nightly job if yesterday is still unprocessed
        continue-on-error: true
        run: python scripts/catch_up.py
      - name: Check the collector
        id: check
        run: |
          set +e
          python scripts/watchdog.py | tee report.txt
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Open or update an issue while there is a problem
        if: steps.check.outputs.code != '0'
        run: |
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          if [ -z "$number" ]; then
            gh issue create --title "$TITLE" --body-file report.txt
          else
            gh issue comment "$number" --body-file report.txt
          fi
      - name: Close the issue once the collector is healthy again
        if: steps.check.outputs.code == '0'
        run: |
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "Collector is healthy again. $(cat report.txt)"
          fi
      - name: Fail the run so GitHub sends a notification
        if: steps.check.outputs.code != '0'
        run: exit 1
