name: Examples

# Runs the scripts in examples/ (the ones shown on the Download page and in
# the README) against the published data, once a week and on demand, and
# whenever they change. They read the live data branch and Releases, so this
# is the test that the published files still load the way we tell people to
# load them.
on:
  schedule:
    - cron: "23 15 * * 3"
  push:
    branches: [main]
    paths:
      - "examples/**"
      - "scripts/check_examples.py"
      - ".github/workflows/examples.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: constraints.txt
      # pandas and DuckDB are what a reader would install today, so they are
      # deliberately not pinned: this is a test of what a reader gets.
      - run: pip install pandas pyarrow duckdb-cli
      - name: Install R with readr and arrow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq r-base-core r-cran-readr r-cran-arrow || sudo apt-get install -y -qq r-base-core r-cran-readr
      - run: python scripts/check_examples.py --require python duckdb
