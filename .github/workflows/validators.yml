name: Validators

# The industry's own validators on what we archived (pipeline/feed_validation.py):
# MobilityData's GTFS Schedule validator on each new Passio schedule version,
# and its GTFS Realtime validator on one archived hour a week. Only their
# summaries are kept, under validation/ on the data branch; scripts/anomaly.py
# reads them. Runs daily after the nightly job; the realtime check runs when
# its last report is a week old. Writes to data-staging; data moves after the
# light gate (scripts/light_gate_promote.sh), or with the nightly job's next
# promotion when staging holds commits its full gate has not passed.
on:
  schedule:
    - cron: "53 16 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write # redeploy the site after publishing

env:
  # A pinned release, checked by its SHA-256 before use.
  STATIC_JAR_URL: https://github.com/MobilityData/gtfs-validator/releases/download/v8.0.1/gtfs-validator-8.0.1-cli.jar
  STATIC_JAR_SHA256: 19293ddd9b6f954f216d4f12054bd8a3232921751c4484339e339764a91000e2
  # The realtime validator publishes no releases, so it is built from a pinned commit.
  RT_REPO: https://github.com/MobilityData/gtfs-realtime-validator
  RT_COMMIT: 7041fa3fcaf674bf730e17325c179d329cdff6f2

jobs:
  validate:
    # One writer of the data branches at a time (with nightly.yml and
    # compare.yml), so promotions happen in order.
    concurrency:
      group: data-writer
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - run: pip install -e . -c constraints.txt
      - name: Get the staging data branch
        run: scripts/get_data_branch.sh
      - id: due
        name: Is a realtime check due?
        run: python -m pipeline.feed_validation --data data-branch --due >> "$GITHUB_OUTPUT"
      - name: Get the schedule validator
        run: |
          curl -fsSL -o gtfs-validator.jar "$STATIC_JAR_URL"
          echo "$STATIC_JAR_SHA256  gtfs-validator.jar" | sha256sum -c -
      - name: Build the realtime validator
        if: steps.due.outputs.realtime == 'true'
        run: |
          git init -q rt-validator
          cd rt-validator
          git fetch -q --depth 1 "$RT_REPO" "$RT_COMMIT"
          git checkout -q FETCH_HEAD
          cd gtfs-realtime-validator-lib
          mvn -B -q package -DskipTests
          cp target/gtfs-realtime-validator-lib-1.0.0-SNAPSHOT-withAllDependencies.jar "$GITHUB_WORKSPACE/gtfs-rt-validator.jar"
      - name: Validate
        env:
          DUE: ${{ steps.due.outputs.realtime }}
        run: |
          args=(--data data-branch --static-jar gtfs-validator.jar --work "$RUNNER_TEMP/validator-work")
          if [ "$DUE" = "true" ]; then args+=(--rt-jar gtfs-rt-validator.jar); fi
          python -m pipeline.feed_validation "${args[@]}"
      # The gate and the publishing scripts run with the code of main as it is
      # now: a stage version bumped while the validators ran would otherwise
      # make the gate refuse data that the nightly job has already rebuilt.
      # The validators' summaries are in data-branch/, which this leaves alone.
      - name: Use the current code of main
        if: ${{ !cancelled() }}
        run: |
          git fetch -q --depth 1 origin main
          git checkout -q FETCH_HEAD
          pip install -q -e . -c constraints.txt
      # A summary is written whole once its validator has finished, so what
      # one validator found is kept even if the other fails.
      - name: Publish to data-staging
        if: ${{ !cancelled() }}
        run: scripts/publish_data.sh data-staging "Validators:"
      - name: Check the figures and move data
        if: ${{ !cancelled() && env.STAGING_BASE == env.DATA_BASE }}
        run: scripts/light_gate_promote.sh
      - name: Leave the promotion to the nightly job
        if: ${{ !cancelled() && env.STAGING_BASE != env.DATA_BASE }}
        run: echo "data-staging holds commits the nightly gate has not passed; the nightly job promotes these summaries with them"
      - name: Redeploy the site with the new summaries
        if: ${{ !cancelled() && env.PROMOTED == '1' }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
