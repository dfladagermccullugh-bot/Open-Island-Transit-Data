name: Site

# Builds the public site with Quarto and deploys it to GitHub Pages. Runs
# when the nightly job changed the `data` branch (it dispatches this
# workflow), when the site or the methods and codebook change, and on demand.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/methods.md"
      - "docs/codebook.md"
      - "scripts/site_data.py"
      - "scripts/check_site.py"
      - "scripts/test_site.sh"
      - "tests/site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# A deploy in progress is allowed to finish; a newer one waits its turn.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Get the data branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data
          path: data-branch
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/workflows/pages.yml
      - name: Copy the published metrics into the site
        run: python scripts/site_data.py data-branch site/data
      - name: Install Quarto
        run: pip install quarto-cli==1.11.9
      - name: Render
        run: quarto render site
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/site/package-lock.json
      # Checks the files, then opens every page in a browser. A page that
      # fails to run stops the deploy here, so the site that is live stays up
      # instead of being replaced by one with an error on it.
      - name: Check the rendered site and open every page
        run: scripts/test_site.sh smoke
        env:
          PLAYWRIGHT_INSTALL: "1"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
