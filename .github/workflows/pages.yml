name: Site

# Builds the public site with Quarto and deploys it to GitHub Pages. Runs
# when the nightly job changed the `data` branch (it dispatches this
# workflow), when the site or the methods and codebook change, and on demand.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/methods.md"
      - "docs/codebook.md"
      - "scripts/site_data.py"
      - "scripts/check_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# A deploy in progress is allowed to finish; a newer one waits its turn.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
      - name: Get the data branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: data
          path: data-branch
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/workflows/pages.yml
      - name: Copy the published metrics into the site
        run: python scripts/site_data.py data-branch site/data
      - name: Install Quarto
        run: pip install quarto-cli==1.11.9
      - name: Render
        run: quarto render site
      - name: Check the rendered site
        run: python scripts/check_site.py site/_site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
