name: Site

# Builds the public site with Quarto and deploys it to GitHub Pages. Runs
# after each nightly archive run (new data on the `data` branch), when the
# site or the methods and codebook change, and on demand.
on:
  workflow_run:
    workflows: ["Nightly archive"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/methods.md"
      - "docs/codebook.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Get the data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch
        continue-on-error: true
      - name: Copy the published metrics into the site
        run: |
          mkdir -p site/data
          for d in manifest quality ontime; do
            if [ -d "data-branch/$d" ]; then cp -r "data-branch/$d" site/data/; fi
          done
          ls -R site/data | head -50
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Quarto
        run: pip install quarto-cli==1.11.9
      - name: Render
        run: quarto render site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
