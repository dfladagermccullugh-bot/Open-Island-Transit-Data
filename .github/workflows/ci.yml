name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch replaces a run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - run: pip install -e ".[dev]" -c constraints.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      # A change to the code behind a stage's numbers needs a new version.
      - run: python scripts/check_versions.py
      - run: pytest -q
      # The published tables against the data dictionary, with Frictionless
      # (the Open Knowledge Foundation's validator), on the made-up archive.
      - name: Validate the tables against datapackage.json
        run: |
          pip install frictionless==5.21.0
          cp -r tests/golden/data-branch "$RUNNER_TEMP/dp"
          cp datapackage.json "$RUNNER_TEMP/dp/"
          cd "$RUNNER_TEMP/dp" && frictionless validate datapackage.json
      # The shell scripts and the workflow files are code too.
      - run: shellcheck scripts/*.sh
      - name: Check the workflow files
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  collector:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.6
      - run: deno check supabase/functions/collect/index.ts
      - run: deno test --allow-read supabase/functions/collect/

  # Renders the site with a kept copy of the data and tries every page in a
  # browser: no errors, no accessibility violations, and the things a reader
  # does (pick a route, resize, use the keyboard, tap) work.
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/workflows/pages.yml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/site/package-lock.json
      - name: Install Quarto
        run: pip install quarto-cli==1.11.9
      - name: Render the site and test it in a browser
        run: scripts/test_site.sh
        env:
          PLAYWRIGHT_INSTALL: "1"
      - name: Keep the report when a test fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-test-report
          path: tests/site/playwright-report
          retention-days: 7
