name: Release self-test

# Manual only. Runs pipeline/release.py against a throwaway release
# (created, uploaded to, downloaded from, then deleted) to confirm the
# gh commands work with the Actions token.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e . -c constraints.txt
      - run: gh --version
      - run: python scripts/selftest_release.py "$GITHUB_REPOSITORY" "$RUNNER_TEMP/selftest"
