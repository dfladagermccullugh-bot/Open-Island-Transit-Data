name: Release self-test

# Manual only. Runs pipeline/release.py against a throwaway release
# (created, uploaded to, downloaded from, then deleted) to confirm the
# gh commands work with the Actions token.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e . -c constraints.txt
      - run: gh --version
      - run: python scripts/selftest_release.py "$GITHUB_REPOSITORY" "$RUNNER_TEMP/selftest"
