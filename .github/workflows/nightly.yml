name: Nightly archive

# Copies every complete service day from the collector to GitHub Releases,
# builds the parsed daily tables from those files, updates the static GTFS
# version registry and crosswalk, infers stop events and on-time summaries,
# computes the daily quality metrics, and writes a report for each closed
# month (with checksums and notes on its Releases). All outputs except the
# Release files are committed to the `data-staging` branch after each stage,
# so a stage that fails or runs out of time does not hold back the ones
# before it. The `data` branch, which the site and every reader use, moves
# to that commit only when the publishing gate passes (scripts/promote_data.sh),
# so it only ever holds checked figures. Runs after midnight Pacific
# (08:35 UTC) with further attempts through the day, because GitHub drops
# scheduled runs when busy (the first 08:35 run never started). Every step
# only handles pending days, so extra attempts cost about a minute and change
# nothing. The watchdog also dispatches this workflow if yesterday is still
# unprocessed (scripts/catch_up.py). The site is redeployed only when the
# data branch moved.
on:
  schedule:
    - cron: "35 8 * * *"
    - cron: "47 9 * * *"
    - cron: "23 11 * * *"
    - cron: "35 14 * * *"
    - cron: "13 17 * * *"
    - cron: "41 20 * * *"
  workflow_dispatch:
    inputs:
      force_gate_fail:
        description: "Test only: make the gate fail, to check that data stays where it is"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write
  # Signed provenance for the files uploaded to Releases (free for public
  # repositories): anyone can check a file was built by this workflow.
  id-token: write
  attestations: write

jobs:
  archive:
    # One writer of the data branches at a time (with compare.yml and
    # validators.yml), so promotions happen in order.
    concurrency:
      group: data-writer
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - run: pip install -e . -c constraints.txt
      - name: Tell the outside monitor the run started
        run: scripts/ping.sh start
        env:
          HC_PING_URL: ${{ secrets.HC_PING_URL }}

      - name: Get the staging data branch (create it from data the first time)
        run: |
          scripts/get_data_branch.sh
          cp docs/data-branch-readme.md data-branch/README.md

      # Each stage records its exit code and the job goes on: one failing
      # stage must not hold back the others. What it finished is published
      # at once.
      - name: Archive pending days
        id: archive
        timeout-minutes: 10
        run: |
          set +e
          python -m pipeline.archive --pending --release \
            --manifest data-branch/manifest/raw.json --out work/files
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Publish after archive
        if: always()
        run: scripts/publish_data.sh data-staging "After archive:"

      - name: Build parsed tables for archived days
        id: tables
        if: always()
        timeout-minutes: 10
        run: |
          set +e
          python -m pipeline.tables --pending --release \
            --raw-manifest data-branch/manifest/raw.json \
            --manifest data-branch/manifest/parsed.json \
            --raw-dir work/files --out work/tables
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Publish after tables
        if: always()
        run: scripts/publish_data.sh data-staging "After tables:"

      - name: Update static GTFS versions
        id: static
        if: always()
        timeout-minutes: 5
        run: |
          set +e
          python -m pipeline.gtfs --raw-manifest data-branch/manifest/raw.json \
            --manifest data-branch/manifest/static.json --raw-dir work/files \
            --tables-dir work/tables \
            --crosswalk-dir data-branch/crosswalk --timepoints-dir data-branch/timepoints
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Publish after static
        if: always()
        run: scripts/publish_data.sh data-staging "After static:"

      - name: Infer stop events and on-time summary
        id: events
        if: always()
        timeout-minutes: 10
        run: |
          set +e
          python -m pipeline.events --pending --release --data data-branch \
            --raw-dir work/files --tables-dir work/tables --out work/events
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Publish after events
        if: always()
        run: scripts/publish_data.sh data-staging "After events:"

      - name: Score field observations
        id: field
        if: always()
        timeout-minutes: 3
        run: |
          set +e
          python -m pipeline.events.field score --data data-branch --tables-dir work/events
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Publish after field
        if: always()
        run: scripts/publish_data.sh data-staging "After field:"

      - name: Compute quality metrics
        id: quality
        if: always()
        timeout-minutes: 10
        run: |
          set +e
          python -m pipeline.quality --pending --data data-branch \
            --raw-dir work/files --tables-dir work/tables --events-dir work/events
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Publish after quality
        if: always()
        run: scripts/publish_data.sh data-staging "After quality:"

      # The home page headline and the hour, day, week and month views
      # (pipeline/periods.py), rebuilt from all day files.
      - name: Write the period files
        id: periods
        if: always()
        timeout-minutes: 3
        run: |
          set +e
          python -m pipeline.periods --data data-branch
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Publish after periods
        if: always()
        run: scripts/publish_data.sh data-staging "After periods:"

      # Comparisons with other bus systems (pipeline/compare.py), from our
      # deviations and the peers' published rules in reference/peers/.
      - name: Write the comparisons
        id: compare
        if: always()
        timeout-minutes: 3
        run: |
          set +e
          python -m pipeline.compare --data data-branch
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Publish after comparisons
        if: always()
        run: scripts/publish_data.sh data-staging "After comparisons:"

      # The tiered data checks (scripts/anomaly.py), written for the site
      # as quality/notes.json. A finding here does not fail the nightly
      # job; the watchdog reports it.
      - name: Note what the latest day's figures need
        if: always()
        timeout-minutes: 3
        run: |
          set +e
          python scripts/anomaly.py --data data-branch --write-notes
          echo "exit $?"
      - name: Publish after notes
        if: always()
        run: scripts/publish_data.sh data-staging "After notes:"

      - name: Monthly reports and release checksums for closed months
        id: monthly
        if: always()
        timeout-minutes: 5
        run: |
          set +e
          python -m pipeline.monthly --data data-branch --release --work work/monthly
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Publish after monthly
        if: always()
        run: scripts/publish_data.sh data-staging "After monthly:"

      # files.csv lists every Release file with its address and SHA-256;
      # datapackage.json is the codebook in a form a program can read.
      - name: Write the file index and the data dictionary
        id: index
        if: always()
        timeout-minutes: 5
        run: |
          set +e
          python -m pipeline.datapackage --data data-branch
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Publish after the index
        if: always()
        run: scripts/publish_data.sh data-staging "After index:"

      - name: Validate the published tables against datapackage.json
        id: frictionless
        if: always()
        timeout-minutes: 5
        run: |
          set +e
          pip install -q frictionless==5.21.0 && (cd data-branch && frictionless validate datapackage.json)
          echo "code=$?" >> "$GITHUB_OUTPUT"

      # The publishing gate (pipeline/invariants.py): every rule the published
      # figures must obey, the stop events of the last three days recounted,
      # the data branch checked against Releases (I12, pipeline/check.py), and
      # the Frictionless result above. Its report, checks/gate.json, goes to
      # data-staging whether it passed or not (the watchdog names the failed
      # rules); data moves only when it passed.
      - name: Check the published figures (publishing gate)
        id: gate
        if: always()
        timeout-minutes: 10
        env:
          FRICTIONLESS: ${{ steps.frictionless.outputs.code }}
          FORCE_FAIL: ${{ inputs.force_gate_fail }}
        run: |
          set +e
          extra=(--extra-check "frictionless=${FRICTIONLESS:-none}")
          if [ "$FORCE_FAIL" = "true" ]; then extra+=(--extra-check "forced-test-failure=1"); fi
          python -m pipeline.invariants --data data-branch --work work/events \
            --report data-branch/checks/gate.json --commit "$(git -C data-branch rev-parse HEAD)" \
            "${extra[@]}"
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Record the gate's report on data-staging
        if: always()
        run: scripts/publish_data.sh data-staging "Gate:"
      - name: Move data to the checked commit
        id: promote
        if: always() && steps.gate.outputs.code == '0'
        run: scripts/promote_data.sh
      # Release files that neither the new data commit nor the one before it
      # (which the live site was built from) names; raw releases are never
      # touched. Not essential: a file left over is only clutter.
      - name: Delete Release files no published manifest names
        if: always() && env.PROMOTED == '1'
        continue-on-error: true
        run: |
          also=()
          if [ -n "$DATA_BASE" ]; then
            mkdir -p work/previous-data
            paths=(manifest)
            if git -C data-branch cat-file -e "$DATA_BASE:reports" 2>/dev/null; then paths+=(reports); fi
            git -C data-branch archive "$DATA_BASE" "${paths[@]}" | tar -x -C work/previous-data
            also=(--also work/previous-data)
          fi
          python -m pipeline.release prune --data data-branch "${also[@]}"

      - name: Attest the Release files this run built or read
        if: always() && hashFiles('work/files/*', 'work/tables/*', 'work/events/*') != ''
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            work/files/*
            work/tables/*
            work/events/*

      - name: Redeploy the site with the new data
        if: always() && env.PROMOTED == '1'
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Tell the outside monitor how the run ended
        if: always()
        run: |
          if [ "${{ steps.gate.outputs.code }}" = "0" ]; then scripts/ping.sh success; else scripts/ping.sh fail; fi
        env:
          HC_PING_URL: ${{ secrets.HC_PING_URL }}

      # A stage that timed out wrote no exit code, so anything but 0 fails.
      - name: Fail if any step above failed
        if: >-
          always() && (
          steps.archive.outputs.code != '0' || steps.tables.outputs.code != '0' ||
          steps.static.outputs.code != '0' || steps.events.outputs.code != '0' ||
          steps.field.outputs.code != '0' || steps.periods.outputs.code != '0' || steps.compare.outputs.code != '0' ||
          steps.quality.outputs.code != '0' || steps.monthly.outputs.code != '0' ||
          steps.index.outputs.code != '0' || steps.gate.outputs.code != '0' ||
          steps.frictionless.outputs.code != '0' || steps.promote.outcome == 'failure')
        run: exit 1
