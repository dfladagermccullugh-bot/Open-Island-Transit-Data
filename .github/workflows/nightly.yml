name: Nightly archive

# Copies every complete service day from the collector to GitHub Releases,
# builds the parsed daily tables from those files, updates the static GTFS
# version registry and crosswalk, infers stop events and on-time summaries,
# and computes the daily quality metrics. All
# outputs except the Release files are committed to the `data` branch. Runs after midnight Pacific
# (08:35 UTC) with a second attempt later in the morning.
on:
  schedule:
    - cron: "35 8 * * *"
    - cron: "35 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      - name: Get the data branch (create it on the first run)
        run: |
          git init -q data-branch
          cd data-branch
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin data; then
            git checkout -q -b data FETCH_HEAD
          else
            git checkout -q --orphan data
            printf '%s\n' "# Data branch" "" \
              "Written by the nightly archive job. \`manifest/raw.json\` lists every" \
              "archived service day, its files in GitHub Releases, and their hashes;" \
              "\`manifest/parsed.json\` does the same for the parsed tables;" \
              "\`manifest/static.json\` lists static GTFS versions and the one" \
              "pinned to each service day; \`crosswalk/\` links Passio and" \
              "Trillium stops, routes and Trillium timepoints for each version pair;" \
              "\`timepoints/\` holds the true timepoints from the printed timetables;" \
              "\`quality/\` holds the daily feed-quality metrics; \`ontime/\` the" \
              "experimental on-time summaries." > README.md
          fi

      - name: Archive pending days
        id: archive
        run: |
          set +e
          python -m pipeline.archive --pending --release \
            --manifest data-branch/manifest/raw.json --out work/files
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Build parsed tables for archived days
        id: tables
        run: |
          set +e
          python -m pipeline.tables --pending --release \
            --raw-manifest data-branch/manifest/raw.json \
            --manifest data-branch/manifest/parsed.json \
            --raw-dir work/files --out work/tables
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Update static GTFS versions
        id: static
        run: |
          set +e
          python -m pipeline.gtfs --raw-manifest data-branch/manifest/raw.json \
            --manifest data-branch/manifest/static.json --raw-dir work/files \
            --crosswalk-dir data-branch/crosswalk --timepoints-dir data-branch/timepoints
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Infer stop events and on-time summary
        id: events
        run: |
          set +e
          python -m pipeline.events --pending --release --data data-branch \
            --raw-dir work/files --tables-dir work/tables --out work/events
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Compute quality metrics
        id: quality
        run: |
          set +e
          python -m pipeline.quality --pending --data data-branch \
            --raw-dir work/files --tables-dir work/tables
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Publish the manifests
        run: |
          cd data-branch
          git add -A
          if git diff --cached --quiet; then
            echo "manifest unchanged"
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -q -m "Archive manifest $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q origin data
          fi

      - name: Check the data branch against Releases
        id: check
        run: |
          set +e
          python -m pipeline.check --data data-branch
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Fail if any step above failed
        if: >-
          steps.archive.outputs.code != '0' || steps.tables.outputs.code != '0' ||
          steps.static.outputs.code != '0' || steps.events.outputs.code != '0' ||
          steps.quality.outputs.code != '0' || steps.check.outputs.code != '0'
        run: exit 1
