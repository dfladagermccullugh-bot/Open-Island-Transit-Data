[project]
name = "open-island-transit-data"
version = "0.1.0"
description = "Archive and quality measurement of Island Transit's GTFS-Realtime feeds"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "gtfs-realtime-bindings>=1.0.0",
  "requests>=2.31",
  "pyarrow>=15",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/make_fixtures.py" = ["E501"]
