[project]
name = "open-island-transit-data"
version = "0.1.0"
description = "Archive and quality measurement of Island Transit's GTFS-Realtime feeds"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "gtfs-realtime-bindings>=1.0.0",
  "requests>=2.31",
  "pyarrow>=15",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.13", "types-requests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E, F: errors. I: import order. UP: current syntax. B: likely bugs.
# RUF: unused noqa comments and other slips. SIM, C4, PIE, RET: simpler
# equivalents. PERF: needless work in loops.
select = ["E", "F", "I", "UP", "B", "RUF", "SIM", "C4", "PIE", "RET", "PERF"]
ignore = [
  "RUF001", "RUF002", "RUF003",  # the pipeline writes real dashes and multiplication signs
  "RET504",                      # a named result before return is often clearer
  "SIM108",                      # an if statement can read better than a ternary
  "PERF401",                     # a loop that appends can read better than one long comprehension
]

[tool.ruff.lint.per-file-ignores]
"scripts/make_fixtures.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
files = ["pipeline", "scripts"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
check_untyped_defs = true

# Libraries that ship no type information.
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "google.transit", "google.transit.*", "google.protobuf.*"]
ignore_missing_imports = true

# The modules everything else stands on are fully typed: every function says
# what it takes and returns.
[[tool.mypy.overrides]]
module = ["pipeline.common", "pipeline.stats", "pipeline.geo", "pipeline.records", "pipeline.config", "pipeline.gtfs.zipread", "pipeline.gtfs.tables", "pipeline.gtfs.holidays"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
