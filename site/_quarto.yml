project:
  type: website
  output-dir: _site
  resources:
    - data/**

website:
  title: "Open Island Transit Data"
  site-url: "https://dfladagermccullugh-bot.github.io/Open-Island-Transit-Data/"
  repo-url: "https://github.com/dfladagermccullugh-bot/Open-Island-Transit-Data"
  navbar:
    left:
      - href: index.qmd
        text: Status
      - href: quality.qmd
        text: Feed quality
      - href: ontime.qmd
        text: On-time (experimental)
      - href: methods.qmd
        text: Methods
      - href: data.qmd
        text: Data
    right:
      - icon: github
        href: "https://github.com/dfladagermccullugh-bot/Open-Island-Transit-Data"
        aria-label: Source code on GitHub
  page-footer:
    center: >-
      Every number on this site is computed by code in the
      [repository](https://github.com/dfladagermccullugh-bot/Open-Island-Transit-Data).
      Not affiliated with Island Transit.

format:
  html:
    theme:
      light: [cosmo, styles.scss]
      dark: [darkly, styles-dark.scss]
    respect-user-color-scheme: true
    toc: false
    page-layout: full
