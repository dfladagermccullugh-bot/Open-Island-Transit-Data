project:
  type: website
  output-dir: _site
  resources:
    - data/**
    - lib.js
    - charts.js
    - map.js
    - page.js
    - vendor/**
    - favicon.svg
    - favicon-32.png
    - apple-touch-icon.png
    - social-card.png

website:
  title: "Open Island Transit Data"
  description: "How often Island Transit's buses on Whidbey and Camano Islands run on time, figured out from their live locations, with every number and file free to check."
  site-url: "https://islandtransitdata.org/"
  repo-url: "https://github.com/dfladagermccullugh-bot/Open-Island-Transit-Data"
  favicon: favicon.svg
  image: social-card.png
  image-alt: "Open Island Transit Data: how on time are Island Transit's buses?"
  open-graph:
    locale: en_US
    site-name: "Open Island Transit Data"
  twitter-card:
    card-style: summary_large_image
  search: false
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: routes.qmd
        text: Routes
      - href: stops.qmd
        text: Stops
      # The On time page, renamed; its address stays ontime.html.
      - href: ontime.qmd
        text: Trends
      - href: compare.qmd
        text: Compare
      - text: Data & methods
        menu:
          - href: quality.qmd
            text: Data quality
          - href: data.qmd
            text: Download
          - href: methods.qmd
            text: Methods
          - href: limits.qmd
            text: Limits
          - href: codebook.qmd
            text: Codebook
          - href: glossary.qmd
            text: Plain words
    right:
      # An inline mark instead of `icon: github`, which loads a whole icon
      # font (about 176 KB) for one glyph. GitHub's mark, from Octicons (MIT).
      - href: "https://github.com/dfladagermccullugh-bot/Open-Island-Transit-Data"
        aria-label: Source code on GitHub
        text: '<svg class="gh-mark" viewBox="0 0 16 16" width="18" height="18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg><span class="visually-hidden">Source code on GitHub</span>'
  page-footer:
    center: >-
      Not affiliated with Island Transit ·
      <span id="data-through"></span>
      [Spotted something off? Tell us](https://github.com/dfladagermccullugh-bot/Open-Island-Transit-Data/issues/new/choose) ·
      [What the data can and can't tell you](limits.qmd) ·
      [Plain words](glossary.qmd) ·
      [Codebook](codebook.qmd) ·
      [Data license](https://github.com/dfladagermccullugh-bot/Open-Island-Transit-Data/blob/main/LICENSE-DATA.md) ·
      [Source code](https://github.com/dfladagermccullugh-bot/Open-Island-Transit-Data) ·
      Map &copy; OpenStreetMap contributors

format:
  html:
    theme:
      light: [cosmo, styles.scss]
      dark: [darkly, styles-dark.scss]
    respect-user-color-scheme: true
    toc: false
    page-layout: full
    lang: en-US
    canonical-url: true
    # No cell shows its code, so Quarto's copy buttons would be empty,
    # nearly invisible buttons a keyboard still stops on.
    code-copy: false
    include-in-header: _head.html
    include-after-body: _after.html
