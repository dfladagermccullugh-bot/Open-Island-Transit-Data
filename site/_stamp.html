<script>
// Says in the footer which service day the figures run through. The file is
// written when the site is built (scripts/site_data.py).
function showDataThrough() {
  var slot = document.getElementById("data-through");
  if (!slot) return;
  fetch("data/build.json").then(function (r) { return r.ok ? r.json() : null; }).then(function (b) {
    if (!b || !b.data_through) return;
    var d = new Date(b.data_through + "T12:00:00Z");
    if (isNaN(d.getTime())) return;
    var text = d.toLocaleDateString("en-US", {month: "long", day: "numeric", year: "numeric", timeZone: "UTC"});
    slot.textContent = "Data through " + text + " · ";
  }).catch(function () {});
}
// The footer comes after this script in the page, so wait for the whole page.
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", showDataThrough);
else showDataThrough();
</script>
